services:
  jellydash:
    build:
      context: .
      args:
        NEXT_PUBLIC_IMAGE_PROTOCOL: ${NEXT_PUBLIC_IMAGE_PROTOCOL:-https}
        NEXT_PUBLIC_IMAGE_HOSTNAME: ${NEXT_PUBLIC_IMAGE_HOSTNAME:-}
        NEXT_PUBLIC_ALLOWED_DEV_ORIGIN: ${NEXT_PUBLIC_ALLOWED_DEV_ORIGIN:-}
    container_name: jellydash
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - jellydash-data:/app/app/db

volumes:
  jellydash-data:
