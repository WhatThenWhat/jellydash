# Standalone Jellydash (multi-server). For the combined Jellydash + Wizarr stack see deploy/compose.yaml.
services:
  jellydash:
    image: ghcr.io/whatthenwhat/jellydash-multi:latest
    container_name: jellydash-multi
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"   # reverse proxy terminates TLS and forwards here
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
